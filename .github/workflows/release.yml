name: Package and Release

# Packages tagged commits with the BigWigs packager and publishes to GitHub,
# CurseForge, Wago and WoWInterface. A site is skipped when its project ID
# (X-Curse-Project-ID, X-Wago-ID, X-WoWI-ID in RGXQoL.toc) or its token secret
# is missing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches the TOC
        shell: bash
        run: |
          version="$(grep -oP '^## Version:\s*\K.*' RGXQoL.toc | tr -d '\r')"
          tag="${GITHUB_REF#refs/tags/}"
          if [[ -z "$version" || "${tag#v}" != "${version#v}" && "${tag%%-*}" != "v${version#v}" ]]; then
            echo "::error::Tag '$tag' does not match TOC version '$version'."
            exit 1
          fi

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && exit 0

          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            *-beta*)  colour=16744448; label="Beta Build" ;;
            *-alpha*) colour=9109504;  label="Alpha Build" ;;
            *)        colour=385018;   label="Stable Release" ;;
          esac
          version="${tag%%-*}"

          # What's new: the matching section of docs/CHANGELOG.md, trimmed to fit an embed field.
          summary="$(awk -v v="${version#v}" '$0 ~ "^## " v "$" {f=1; next} /^## / {f=0} f' docs/CHANGELOG.md | sed '/^$/d' | head -c 900)"
          [[ -z "$summary" ]] && summary="See the release page."

          jq -n \
            --arg title "RGX | AQoL ${tag}" \
            --arg url "https://github.com/${REPO}/releases/tag/${tag}" \
            --arg description "A new ${label,,} is live." \
            --arg summary "$summary" \
            --arg footer "RGX Mods • ${label}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg logo "https://raw.githubusercontent.com/RGXMods/RGX-Framework/main/media/logo.png" \
            --argjson colour "$colour" \
            '{username: "RGX Releases", avatar_url: $logo,
              embeds: [{title: $title, url: $url, description: $description, color: $colour,
                        fields: [{name: "What'"'"'s New", value: $summary, inline: false}],
                        footer: {text: $footer}, timestamp: $timestamp}]}' > payload.json

          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "Content-Type: application/json" -X POST -d @payload.json "$DISCORD_WEBHOOK"
