name: Package and Release

# Packages tagged commits with the BigWigs packager and publishes to GitHub,
# CurseForge, Wago and WoWInterface. A site is skipped when its project ID
# (X-Curse-Project-ID, X-Wago-ID, X-WoWI-ID in RGXQoL.toc) or its token secret
# is missing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches the TOC
        shell: bash
        run: |
          version="$(grep -oP '^## Version:\s*\K.*' RGXQoL.toc | tr -d '\r')"
          tag="${GITHUB_REF#refs/tags/}"
          if [[ -z "$version" || "${tag#v}" != "${version#v}" && "${tag%%-*}" != "v${version#v}" ]]; then
            echo "::error::Tag '$tag' does not match TOC version '$version'."
            exit 1
          fi

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
