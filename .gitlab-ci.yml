variables:
  GITHUB_MIRROR_REPOSITORY: RGXMods/RGXAQoL

include:
  - project: rgxmods/warcraft/RGX-Framework
    ref: main
    file: /.gitlab/ci/addon.yml

test:aqol:
  stage: validate
  image: alpine:3.20
  script:
    - apk add --no-cache lua5.1 git
    - git clone --depth 1 https://github.com/RGXMods/RGX-Framework.git ../RGX-Framework
    - git -C ../RGX-Framework rev-parse HEAD
    - |
      for t in tests/*.test.lua; do
        echo "test $t"
        RGXFW_PATH=../RGX-Framework lua5.1 "$t" || exit 1
      done
